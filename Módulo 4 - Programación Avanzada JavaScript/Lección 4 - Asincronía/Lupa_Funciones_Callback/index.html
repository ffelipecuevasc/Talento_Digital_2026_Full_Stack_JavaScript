<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio Práctico - Funciones Callback</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .loader {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #3b82f6;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
      display: inline-block;
      vertical-align: middle;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen p-8">

<main class="max-w-3xl mx-auto">
  <header class="mb-8 border-b border-gray-700 pb-4">
    <h1 class="text-3xl font-bold text-blue-400">Laboratorio de Callbacks</h1>
    <p class="text-gray-400 mt-2">Validaciones, cálculos matemáticos y asincronía.</p>
  </header>

  <div class="bg-gray-800 rounded-lg p-6 shadow-xl border border-gray-700 mb-6">
    <h2 class="text-xl font-semibold text-white mb-4">Ejecución Integral</h2>
    <p class="text-sm text-gray-400 mb-6">
      Al hacer clic en el botón, el sistema ejecutará las 3 funciones solicitadas en cadena utilizando Callbacks.
    </p>
    <button id="btn-iniciar" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded transition w-full md:w-auto">
      Iniciar Secuencia de Callbacks
    </button>
  </div>

  <div class="bg-gray-950 rounded-lg p-6 shadow-xl border border-gray-700 min-h-[300px]">
    <div class="flex justify-between items-center mb-4">
      <h3 class="text-lg font-semibold text-green-400">Consola de Salida:</h3>
      <div id="indicador-carga" class="hidden text-yellow-400 text-sm font-semibold">
        <span class="loader mr-2"></span> Esperando 5 segundos...
      </div>
    </div>
    <pre id="consola-salida" class="whitespace-pre-wrap text-sm text-gray-300 font-mono leading-relaxed"></pre>
  </div>
</main>

<script src="scripts.js"></script>
</body>
</html>
