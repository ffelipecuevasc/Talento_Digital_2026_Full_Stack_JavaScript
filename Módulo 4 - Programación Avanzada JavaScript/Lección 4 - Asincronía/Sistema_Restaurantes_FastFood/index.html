<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laboratorio de Asincronía JS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Animación CSS para demostrar si el hilo principal está bloqueado */
    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid #3b82f6;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen p-8">

<main class="max-w-4xl mx-auto space-y-6">
  <header class="border-b border-gray-700 pb-4 flex justify-between items-center">
    <div>
      <h1 class="text-3xl font-bold text-blue-400">Simulador de Asincronía</h1>
      <p class="text-gray-400">De Callbacks a Async/Await</p>
    </div>
    <div class="flex items-center gap-3 bg-gray-800 p-3 rounded-lg border border-gray-700">
      <span class="text-sm font-semibold">Estado de la Interfaz:</span>
      <div class="spinner"></div>
    </div>
  </header>

  <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
    <button id="btn-bloqueante" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded transition">1. Código Bloqueante</button>
    <button id="btn-callbacks" class="bg-yellow-600 hover:bg-yellow-700 text-white font-bold py-2 px-4 rounded transition">2. Callbacks (Infierno)</button>
    <button id="btn-promesas" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded transition">3. Promesas (.then)</button>
    <button id="btn-async" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition">4. Async / Await</button>
  </div>

  <div class="bg-gray-950 p-4 rounded border border-gray-700 min-h-[300px]">
    <h2 class="text-green-400 font-bold mb-2">Consola de Salida:</h2>
    <pre id="consola" class="text-sm text-gray-300 whitespace-pre-wrap font-mono"></pre>
  </div>
</main>

<script src="scripts.js"></script>
</body>
</html>
