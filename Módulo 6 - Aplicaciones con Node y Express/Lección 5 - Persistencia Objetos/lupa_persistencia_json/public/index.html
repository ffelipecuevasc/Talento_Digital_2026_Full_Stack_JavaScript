<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Ejecutivos - BancoEstado</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans p-8">
<div class="max-w-4xl mx-auto">
  <h1 class="text-3xl font-bold text-blue-900 mb-6">Panel de Control Bancario</h1>

  <div class="flex gap-4 mb-6">
    <button onclick="loadClients('/api/clients')" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">Listar Todos</button>
    <button onclick="loadClients('/api/clients/rut')" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 transition">Listar Clientes con RUT</button>
  </div>

  <div class="bg-white rounded-lg shadow p-6">
    <h2 class="text-xl font-semibold mb-4 border-b pb-2">Resultados</h2>
    <div id="results" class="space-y-4">
      <!-- Los datos se inyectarán aquí -->
      <p class="text-gray-500">Seleccione una opción para ver los clientes.</p>
    </div>
  </div>
</div>

<script>
  async function loadClients(endpoint) {
    const container = document.getElementById('results');
    container.innerHTML = '<p>Cargando datos...</p>';

    try {
      const response = await fetch(endpoint);
      const data = await response.json();

      if (data.length === 0) {
        container.innerHTML = '<p class="text-gray-500">No hay clientes registrados.</p>';
        return;
      }

      container.innerHTML = data.map(client => `
                    <div class="border p-4 rounded flex justify-between items-center bg-gray-50">
                        <div>
                            <p class="font-bold text-lg">${client.name} (ID: ${client.id})</p>
                            <p class="text-sm text-gray-600">Cuenta RUT: ${client.hasRut ? 'Sí' : 'No'} | Cuentas Ahorro: ${client.ahorroAccounts}</p>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="deleteClient('${client.id}')" class="bg-red-500 text-white px-3 py-1 rounded text-sm hover:bg-red-600">Eliminar Cliente</button>
                            <button onclick="deleteRut('${client.id}')" class="bg-orange-500 text-white px-3 py-1 rounded text-sm hover:bg-orange-600">Quitar RUT</button>
                        </div>
                    </div>
                `).join('');
    } catch (error) {
      container.innerHTML = `<p class="text-red-500">Error al cargar la información.</p>`;
    }
  }

  async function deleteClient(id) {
    if(!confirm('¿Eliminar cliente físicamente del sistema?')) return;
    await fetch(`/api/clients/${id}`, { method: 'DELETE' });
    loadClients('/api/clients'); // Recargar vista
  }

  async function deleteRut(id) {
    await fetch(`/api/clients/${id}/rut`, { method: 'DELETE' });
    loadClients('/api/clients'); // Recargar vista
  }
</script>
</body>
</html>
