<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo Netflix</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans p-8">
<div class="max-w-5xl mx-auto space-y-8">
  <h1 class="text-4xl font-bold text-red-600 text-center mb-8">NETFLIX ADMIN</h1>

  <!-- Botones de Navegación -->
  <div class="flex justify-center gap-4">
    <button onclick="loadData('peliculas')" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-6 rounded transition">LISTA DE PELÍCULAS</button>
    <button onclick="loadData('series')" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-6 rounded transition">LISTA DE SERIES</button>
  </div>

  <!-- Formularios -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
    <div class="bg-gray-800 p-6 rounded-lg">
      <h2 class="text-xl font-bold mb-4">Nueva Película</h2>
      <form id="formMovie" onsubmit="addEntry(event, 'peliculas')" class="space-y-4">
        <input type="text" id="p_nombre" placeholder="Nombre" required class="w-full p-2 bg-gray-700 rounded text-white border border-gray-600">
        <input type="text" id="p_director" placeholder="Director" required class="w-full p-2 bg-gray-700 rounded text-white border border-gray-600">
        <input type="number" id="p_anio" placeholder="Año" required class="w-full p-2 bg-gray-700 rounded text-white border border-gray-600">
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 py-2 rounded font-bold">AGREGAR NUEVA PELÍCULA</button>
      </form>
    </div>

    <div class="bg-gray-800 p-6 rounded-lg">
      <h2 class="text-xl font-bold mb-4">Nueva Serie</h2>
      <form id="formSeries" onsubmit="addEntry(event, 'series')" class="space-y-4">
        <input type="text" id="s_nombre" placeholder="Nombre" required class="w-full p-2 bg-gray-700 rounded text-white border border-gray-600">
        <input type="number" id="s_anio" placeholder="Año Estreno" required class="w-full p-2 bg-gray-700 rounded text-white border border-gray-600">
        <input type="number" id="s_temporadas" placeholder="Número de temporadas" required class="w-full p-2 bg-gray-700 rounded text-white border border-gray-600">
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 py-2 rounded font-bold">AGREGAR NUEVA SERIE</button>
      </form>
    </div>
  </div>

  <!-- Resultados y Ordenamiento -->
  <div class="bg-gray-800 p-6 rounded-lg">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-xl font-bold" id="listTitle">Catálogo</h2>
      <select id="sortSelect" onchange="sortData()" class="bg-gray-700 text-white p-2 rounded hidden">
        <option value="nombre">Ordenar por Nombre</option>
        <option value="anio">Ordenar por Año</option>
        <option value="director" id="optDirector">Ordenar por Director</option>
        <option value="temporadas" id="optTemporadas">Ordenar por Temporadas</option>
      </select>
    </div>
    <div id="results" class="space-y-3"></div>
  </div>
</div>

<script>
  let currentData = [];
  let currentType = '';

  async function loadData(type) {
    currentType = type;
    const res = await fetch(`/api/catalogo?tipo=${type}`);
    currentData = await res.json();

    document.getElementById('listTitle').textContent = type === 'peliculas' ? 'Películas' : 'Series';
    const sortSelect = document.getElementById('sortSelect');
    sortSelect.classList.remove('hidden');

    document.getElementById('optDirector').style.display = type === 'peliculas' ? 'block' : 'none';
    document.getElementById('optTemporadas').style.display = type === 'series' ? 'block' : 'none';

    sortSelect.value = 'nombre';
    renderData();
  }

  function sortData() {
    const sortBy = document.getElementById('sortSelect').value;
    currentData.sort((a, b) => {
      if (a[sortBy] < b[sortBy]) return -1;
      if (a[sortBy] > b[sortBy]) return 1;
      return 0;
    });
    renderData();
  }

  function renderData() {
    const container = document.getElementById('results');
    container.innerHTML = currentData.map(item => `
                <div class="bg-gray-700 p-4 rounded flex justify-between items-center">
                    <div>
                        <h3 class="font-bold text-lg">${item.nombre} (${item.anio})</h3>
                        <p class="text-sm text-gray-400">
                            ${currentType === 'peliculas' ? 'Director: ' + item.director : 'Temporadas: ' + item.temporadas}
                        </p>
                    </div>
                    <button onclick="deleteEntry('${item.nombre}')" class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded">Eliminar</button>
                </div>
            `).join('');
  }

  async function addEntry(e, type) {
    e.preventDefault();
    const item = type === 'peliculas'
            ? { nombre: document.getElementById('p_nombre').value, director: document.getElementById('p_director').value, anio: document.getElementById('p_anio').value }
            : { nombre: document.getElementById('s_nombre').value, anio: document.getElementById('s_anio').value, temporadas: document.getElementById('s_temporadas').value };

    await fetch('/api/catalogo', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tipo: type, item })
    });
    e.target.reset();
    if(currentType === type) loadData(type);
  }

  async function deleteEntry(nombre) {
    if(!confirm(`¿Eliminar ${nombre}?`)) return;
    await fetch(`/api/catalogo/${encodeURIComponent(nombre)}?tipo=${currentType}`, { method: 'DELETE' });
    loadData(currentType);
  }
</script>
</body>
</html>
